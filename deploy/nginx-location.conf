# All business routes inherit shared ServerPortal authentication and cookie renewal.
location = /aura { return 308 /aura/$is_args$args; }
location ^~ /aura/ {
    location ~ ^/aura/(?:favicon\.svg|apple-touch-icon\.png)$ {
        auth_request off;
        limit_except GET { deny all; }
        rewrite ^/aura/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18087;
    }
    proxy_pass http://127.0.0.1:18087/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 9m;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 180s;
    proxy_send_timeout 180s;
    proxy_next_upstream off;
    proxy_redirect off;
}
